apiVersion: v1
kind: Pod
metadata:
  name: emptydir-restart-test
spec:
  containers:
  - name: writer
    image: busybox
    command: ["/bin/sh", "-c"]
    args: ["i=0; while true; do echo $i >> /data/file.txt; i=$((i+1)); sleep 2; done"]
    volumeMounts:
    - name: data-vol
      mountPath: /data

  - name: reader
    image: busybox
    command: ["sleep", "3600"]
    volumeMounts:
    - name: data-vol
      mountPath: /data

  volumes:
  - name: data-vol
    emptyDir: {}
